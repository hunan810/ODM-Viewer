# ============================================================
# ODM 项目 Apache 站点配置（覆盖 php:apache 默认 000-default.conf）
# 挂载到容器内 /etc/apache2/sites-enabled/000-default.conf
# 作用：把原 .htaccess 的全部规则内置进 vhost，并设 AllowOverride None
#       —— 不再读取 .htaccess 文件，避免 NAS 文件权限导致 403
# ============================================================

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # 不依赖 .htaccess 文件（AllowOverride None 后 Apache 不会去读它）
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---------- 1. 开启 gzip / deflate 压缩 ----------
    <IfModule mod_deflate.c>
      AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json application/wasm image/svg+xml text/plain
    </IfModule>

    # ---------- 2. 静态资源长缓存（文件名不变即可永久缓存，刷新靠改文件名） ----------
    <IfModule mod_expires.c>
      ExpiresActive On
      ExpiresByType application/javascript "access plus 1 year"
      ExpiresByType text/javascript        "access plus 1 year"
      ExpiresByType application/wasm       "access plus 1 year"
      ExpiresByType image/png              "access plus 1 month"
      ExpiresByType image/jpeg             "access plus 1 month"
      ExpiresByType image/webp             "access plus 1 month"
      ExpiresByType text/html              "access plus 1 hour"
      ExpiresByType application/json       "access plus 1 hour"
      ExpiresByType text/plain             "access plus 1 month"
    </IfModule>

    # ---------- 3. ESM 模块 MIME 类型兜底（确保 .js 以 application/javascript 返回） ----------
    <IfModule mod_mime.c>
      AddType application/javascript .js
      AddType application/wasm     .wasm
      AddType application/json     .json
      AddType text/plain           .obj .mtl
    </IfModule>

    # ---------- 4. 模型资源长缓存（obj/mtl/glb/gltf/bin） ----------
    <IfModule mod_headers.c>
      <FilesMatch "\.(obj|mtl|glb|gltf|bin)$">
        Header set Cache-Control "max-age=2592000, public"
      </FilesMatch>
    </IfModule>

    # 禁止通过浏览器直接下载这些文件（配置 / 脚本 / 备份 / 日志）
    <FilesMatch "\.(zip|ini|conf|md|py|bak|log)$">
        Require all denied
    </FilesMatch>

    # 禁止下载密码哈希文件 settings.json（前端只用 PHP 间接读它；
    # 哈希一旦泄露可被离线暴力破解，绝不能当静态文件直接访问）
    <FilesMatch "^settings\.json$">
        Require all denied
    </FilesMatch>

    # 禁止访问 agent 工作目录与 docker 配置目录
    <Directory /var/www/html/.workbuddy>
        Require all denied
    </Directory>
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
