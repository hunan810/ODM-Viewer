; ============================================================
; ODM 项目 PHP 配置（替代虚拟主机不生效的 .user.ini）
; 挂载到容器内 /usr/local/etc/php/conf.d/zz-odm.ini
; 作用：放开大文件上传 / 长执行时间，否则模型上传会失败
; ============================================================
file_uploads = On
upload_max_filesize = 200M
post_max_size = 220M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
